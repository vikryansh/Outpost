# ==============================================================================
# Render Blueprint Specification for Outpost
# Automatic deployment from GitHub to Render (Backend Web Service + Frontend Static)
# ==============================================================================

services:
  # 1. Node.js + Express + Socket.io Backend Web Service
  - type: web
    name: outpost-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard from Supabase connection string
      - key: PORT
        value: 10000

  # 2. React (Vite) Frontend Static Site
  - type: web
    name: outpost-client
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SERVER_URL
        sync: false # Point to https://outpost-server.onrender.com
