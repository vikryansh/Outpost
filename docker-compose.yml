services:
  postgres:
    image: postgres:16-alpine
    container_name: outpost_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: outpost_user
      POSTGRES_PASSWORD: outpost_password
      POSTGRES_DB: outpost_db
    ports:
      - "5433:5432"
    volumes:
      - outpost_pgdata:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outpost_user -d outpost_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: outpost_server
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgres://outpost_user:outpost_password@postgres:5432/outpost_db
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: outpost_client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  outpost_pgdata:
